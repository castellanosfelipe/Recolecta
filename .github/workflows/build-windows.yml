name: Windows package and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CPython 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build and test from the offline inventory
        shell: powershell
        run: .\build.ps1

      - name: Verify release archive contents
        shell: powershell
        run: |
          $verify = Join-Path $env:RUNNER_TEMP "fileharvester-verify"
          Expand-Archive -LiteralPath .\dist\FileHarvester-win64.zip -DestinationPath $verify
          $required = @(
            "FileHarvester\FileHarvester.exe",
            "FileHarvester\install.ps1",
            "FileHarvester\install-service.ps1",
            "FileHarvester\uninstall.ps1",
            "FileHarvester\_internal\static\app.js",
            "FileHarvester\_internal\templates\index.html"
          )
          foreach ($relative in $required) {
            $path = Join-Path $verify $relative
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release member: $relative"
            }
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: FileHarvester-win64
          path: |
            dist/FileHarvester-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileHarvester-win64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
